# Bu snippet kadenewmedia.com için mevcut HTTPS `server {}` bloğunun içine eklenir.
# Ana sitenin `/` location'ını değiştirmez; yalnızca /kadexai alanını sahiplenir.

location = /kadexai {
    return 308 /kadexai/;
}

location ^~ /kadexai/_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
    access_log off;
}

location ^~ /kadexai/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 30m;
    proxy_buffering off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# `http {}` seviyesinde, server bloğunun dışında bir kez tanımla:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
