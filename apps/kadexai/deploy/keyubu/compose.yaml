name: kade-production

services:
  web:
    build:
      context: ../../../..
      dockerfile: apps/kadexai/deploy/keyubu/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/kadexai}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - /srv/kade/secrets/kadexai.env
    environment:
      KADE_FASTAPI_BASE_URL: http://media:8472
      KADE_BACKEND_TOKEN: ${KADE_BACKEND_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      media:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  media:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - /srv/kade/secrets/kadexai.env
    environment:
      KADE_ENV: production
      KADE_MEDIA_ROOT: /app/media
      KADE_ALLOWED_ORIGINS: http://web:3000
      REDIS_URL: redis://redis:6379/0
    volumes:
      - /srv/kade/media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /srv/kade/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
