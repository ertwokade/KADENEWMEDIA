# Include inside the existing kadenewmedia.com server block after taking a backup.
# The Next application owns /kadexai. FastAPI is deliberately separated and
# should normally be reachable only by Next/server infrastructure.
location = /kadexai {
    return 308 /kadexai/;
}

location /kadexai/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}

# Optional operational health path. Do not expose feature endpoints through
# this location; Next calls the internal FastAPI address from the server.
location = /kadexai-backend/health {
    proxy_pass http://127.0.0.1:8472/health;
    proxy_set_header Host $host;
}

location /kadexai-backend/ {
    return 404;
}
