document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

94; font-weight:700; letter-spacing:-0.035em;\">\n        Markanı dijitalde<br>\n        <span style=\"font-family:'Newsreader',serif; font-style:italic; font-weight:500; color:#FFD400; text-shadow:0 0 40px rgba(255,212,0,.45);\">parlat.<\u002Fspan>\n      <\u002Fh1>\n      <div style=\"display:flex; align-items:center; flex-wrap:wrap; gap:24px; margin-top:34px;\">\n        <a href=\"#iletisim\" style=\"display:inline-flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:#060606; background:#FFD400; padding:15px 26px; border-radius:999px; box-shadow:0 0 30px rgba(255,212,0,.4); transition:transform .2s, box-shadow .2s;\" style-hover=\"transform:translateY(-2px); box-shadow:0 0 44px rgba(255,212,0,.6);\">Teklif Al <span style=\"font-size:17px;\">↗<\u002Fspan><\u002Fa>\n        <p style=\"margin:0; max-width:330px; font-size:14.5px; line-height:1.5; color:rgba(255,255,255,.6);\">Instagram, TikTok ve YouTube'da içerik üretiminden reklam yönetimine kadar uçtan uca.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HIZMETLER -->\n  <section id=\"hizmetler\" style=\"position:relative; padding:clamp(80px,12vh,150px) clamp(20px,5vw,72px); max-width:1280px; margin:0 auto;\" data-screen-label=\"Hizmetler\">\n    <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:60px;\">\n      <h2 style=\"margin:0; font-size:clamp(30px,4.4vw,58px); font-weight:700; letter-spacing:-0.03em; line-height:1.02;\">Ne yapıyoruz?<\u002Fh2>\n      <p style=\"margin:0; max-width:380px; font-size:15px; line-height:1.55; color:rgba(255,255,255,.55);\">Strateji, içerik ve reklamı tek çatı altında toplayarak markanı sürdürülebilir şekilde büyütüyoruz.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px;\">\n      <div style=\"position:relative; padding:30px 26px 34px; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.07); border-radius:16px; transition:transform .25s, border-color .25s, background .25s;\" style-hover=\"transform:translateY(-4px); border-color:rgba(255,212,0,.45); background:rgba(255,212,0,.04);\">\n        <div style=\"font-family:'Newsreader',serif; font-style:italic; font-size:20px; color:#FFD400; margin-bottom:42px;\">01<\u002Fdiv>\n        <h3 style=\"margin:0 0 10px; font-size:19px; font-weight:600; letter-spacing:-0.01em;\">Sosyal Medya Yönetimi<\u002Fh3>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:rgba(255,255,255,.55);\">Instagram, TikTok ve YouTube hesaplarının planlamadan paylaşıma uçtan uca yönetimi.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative; padding:30px 26px 34px; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.07); border-radius:16px; transition:transform .25s, border-color .25s, background .25s;\" style-hover=\"transform:translateY(-4px); border-color:rgba(255,212,0,.45); background:rgba(255,212,0,.04);\">\n        <div style=\"font-family:'Newsreader',serif; font-style:italic; font-size:20px; color:#FFD400; margin-bottom:42px;\">02<\u002Fdiv>\n        <h3 style=\"margin:0 0 10px; font-size:19px; font-weight:600; letter-spacing:-0.01em;\">İçerik Üretimi<\u002Fh3>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:rgba(255,255,255,.55);\">Markana özel video çekimi, grafik tasarım ve metin yazarlığıyla dikkat çeken içerikler.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative; padding:30px 26px 34px; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.07); border-radius:16px; transition:transform .25s, border-color .25s, background .25s;\" style-hover=\"transform:translateY(-4px); border-color:rgba(255,212,0,.45); background:rgba(255,212,0,.04);\">\n        <div style=\"font-family:'Newsreader',serif; font-style:italic; font-size:20px; color:#FFD400; margin-bottom:42px;\">03<\u002Fdiv>\n        <h3 style=\"margin:0 0 10px; font-size:19px; font-weight:600; letter-spacing:-0.01em;\">Reklam &amp; Performans<\u002Fh3>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:rgba(255,255,255,.55);\">Meta ve Google reklamlarıyla ölçülebilir, geri dönüşü yüksek büyüme kampanyaları.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative; padding:30px 26px 34px; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.07); border-radius:16px; transition:transform .25s, border-color .25s, background .25s;\" style-hover=\"transform:translateY(-4px); border-color:rgba(255,212,0,.45); background:rgba(255,212,0,.04);\">\n        <div style=\"font-family:'Newsreader',serif; font-style:italic; font-size:20px; color:#FFD400; margin-bottom:42px;\">04<\u002Fdiv>\n        <h3 style=\"margin:0 0 10px; font-size:19px; font-weight:600; letter-spacing:-0.01em;\">Strateji &amp; Danışmanlık<\u002Fh3>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:rgba(255,255,255,.55);\">Dijitalde doğru konumlanma, marka sesi ve büyüme yol haritasının kurgulanması.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- MANIFESTO -->\n  <section id=\"manifesto\" style=\"position:relative; padding:clamp(70px,12vh,150px) clamp(20px,6vw,90px); overflow:hidden;\" data-screen-label=\"Yaklaşım\">\n    <div style=\"position:absolute; inset:0; background:radial-gradient(50% 70% at 50% 50%, rgba(255,200,0,.07), rgba(255,200,0,0) 70%); pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:1080px; margin:0 auto;\">\n      <p style=\"margin:0 0 30px; font-size:12.5px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,.5);\">Yaklaşımımız<\u002Fp>\n      <p style=\"margin:0; font-family:'Newsreader',serif; font-style:italic; font-weight:400; font-size:clamp(28px,4.3vw,56px); line-height:1.22; letter-spacing:-0.01em; color:rgba(255,255,255,.92);\">\n        Doğru <span style=\"color:#FFD400;\">içeriği<\u002Fspan>, doğru <span style=\"color:#FFD400;\">kitleye<\u002Fspan>, doğru anda ulaştırıyoruz. Her markanın kendine ait bir enerjisi var — biz onu görünür kılıyor ve dijitalde <span style=\"color:#FFD400;\">harekete geçiriyoruz.<\u002Fspan>\n      <\u002Fp>\n      <div style=\"display:flex; gap:clamp(28px,5vw,80px); flex-wrap:wrap; margin-top:64px;\">\n        <div><div style=\"font-size:clamp(34px,4vw,52px); font-weight:700; letter-spacing:-0.03em;\">120+<\u002Fdiv><div style=\"font-size:13.5px; color:rgba(255,255,255,.5); margin-top:4px;\">Yönetilen marka<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:clamp(34px,4vw,52px); font-weight:700; letter-spacing:-0.03em;\">8M+<\u002Fdiv><div style=\"font-size:13.5px; color:rgba(255,255,255,.5); margin-top:4px;\">Aylık erişim<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:clamp(34px,4vw,52px); font-weight:700; letter-spacing:-0.03em;\">3<\u002Fdiv><div style=\"font-size:13.5px; color:rgba(255,255,255,.5); margin-top:4px;\">Platformda uzmanlık<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ILETISIM / FOOTER -->\n  <section id=\"iletisim\" style=\"position:relative; padding:clamp(80px,13vh,160px) clamp(20px,5vw,72px) 50px; border-top:1px solid rgba(255,255,255,.07);\" data-screen-label=\"İletişim\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:40px; flex-wrap:wrap;\">\n        <div style=\"max-width:620px;\">\n          <h2 style=\"margin:0; font-size:clamp(42px,7vw,96px); font-weight:700; letter-spacing:-0.035em; line-height:0.96;\">Hadi <span style=\"font-family:'Newsreader',serif; font-style:italic; font-weight:500; color:#FFD400;\">tanışalım.<\u002Fspan><\u002Fh2>\n          <p style=\"margin:24px 0 0; font-size:15.5px; line-height:1.6; color:rgba(255,255,255,.6); max-width:440px;\">Markanı bir sonraki seviyeye taşımaya hazırsan, projeni konuşalım. İlk görüşme bizden.<\u002Fp>\n          <a href=\"mailto:merhaba@kademedia.com.tr\" style=\"display:inline-flex; align-items:center; gap:9px; margin-top:34px; font-size:15px; font-weight:600; color:#060606; background:#FFD400; padding:15px 28px; border-radius:999px; box-shadow:0 0 30px rgba(255,212,0,.4); transition:transform .2s, box-shadow .2s;\" style-hover=\"transform:translateY(-2px); box-shadow:0 0 44px rgba(255,212,0,.6);\">Projeni Anlat <span style=\"font-size:17px;\">↗<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:clamp(36px,5vw,72px); flex-wrap:wrap;\">\n          <div>\n            <div style=\"font-size:12px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:14px;\">İletişim<\u002Fdiv>\n            <a href=\"mailto:merhaba@kademedia.com.tr\" style=\"display:block; font-size:15px; color:rgba(255,255,255,.78); margin-bottom:8px;\" style-hover=\"color:#FFD400;\">merhaba@kademedia.com.tr<\u002Fa>\n            <a href=\"https://twitter.com/kadenewmedia\" style=\"display:block; font-size:15px; color:rgba(255,255,255,.78);\" style-hover=\"color:#FFD400;\">@kadenewmedia<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:14px;\">Ofis<\u002Fdiv>\n            <div style=\"font-size:15px; color:rgba(255,255,255,.78); line-height:1.55;\">Biruni Teknopark<br>İstanbul, Türkiye<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-top:clamp(60px,9vh,110px); padding-top:26px; border-top:1px solid rgba(255,255,255,.07);\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\"><path d=\"M13 1.5 L3.5 14 H10.6 L8.5 22.5 L20.5 8.5 H13 Z\" fill=\"#FFD400\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-weight:700; font-size:15px;\">kade <span style=\"color:#FFD400;\">media<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:13px; color:rgba(255,255,255,.4);\">© 2026 Kade Media · İstanbul Sosyal Medya Ajansı<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:820},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFE14D&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#FFD400&quot;,&quot;#FFB200&quot;,&quot;#FFE14D&quot;,&quot;#7C5CFF&quot;],&quot;section&quot;:&quot;Görünüm&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Görünüm&quot;}}\">\nclass Component extends DCLogic {\n  canvasRef = React.createRef();\n\n  componentDidMount() {\n    const canvas = this.canvasRef.current;\n    if (!canvas) return;\n    const ctx = canvas.getContext('2d');\n    const self = this;\n    let W = 0, H = 0, DPR = 1, particles = [];\n    const t0 = performance.now();\n    let mx = 0, my = 0, tmx = 0, tmy = 0;\n\n    const sp = document.createElement('canvas');\n    sp.width = sp.height = 64;\n    const spc = sp.getContext('2d');\n    function hexRGB(h) {\n      h = (h || '#FFD400').replace('#', '');\n      if (h.length === 3) h = h.split('').map(c => c + c).join('');\n      return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];\n    }\n    function buildSprite() {\n      const [r,g,b] = hexRGB(self.props.accent);\n      spc.clearRect(0,0,64,64);\n      const grad = spc.createRadialGradient(32,32,0,32,32,32);\n      grad.addColorStop(0, 'rgba(255,250,235,1)');\n      grad.addColorStop(0.25, 'rgba(' + r + ',' + g + ',' + b + ',0.78)');\n      grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');\n      spc.fillStyle = grad;\n      spc.fillRect(0,0,64,64);\n    }\n    this._buildSprite = buildSprite;\n    buildSprite();\n\n    // Kade Media logo: two interlocking right-triangle blades (pinwheel bolt)\n    const boltTris = [\n      [[0.492,0.004],[0.005,0.590],[0.492,0.590]],\n      [[0.521,0.410],[1.000,0.410],[0.521,0.996]]\n    ];\n    const icons = [\n      {ch:'@', x:0.16, y:0.30, s:0.115},\n      {ch:'#', x:0.30, y:0.62, s:0.10},\n      {ch:'\\u25B6', x:0.205, y:0.80, s:0.10},\n      {ch:'\\u2665', x:0.84, y:0.36, s:0.115},\n      {ch:'\\u2726', x:0.88, y:0.63, s:0.10},\n      {ch:'K', x:0.79, y:0.19, s:0.10}\n    ];\n\n    function sample(drawFn, bw, bh, step) {\n      const off = document.createElement('canvas');\n      off.width = bw; off.height = bh;\n      const o = off.getContext('2d');\n      drawFn(o, bw, bh);\n      const d = o.getImageData(0,0,bw,bh).data, pts = [];\n      for (let y = 0; y < bh; y += step)\n        for (let x = 0; x < bw; x += step)\n          if (d[(y*bw+x)*4+3] > 120) pts.push([x,y]);\n      return pts;\n    }\n    function drawBolt(o, w, h) {\n      o.fillStyle = '#fff';\n      boltTris.forEach(tri => {\n        o.beginPath();\n        tri.forEach((p,i) => { const x = p[0]*w, y = p[1]*h; i ? o.lineTo(x,y) : o.moveTo(x,y); });\n        o.closePath();\n        o.fill();\n      });\n    }\n    function drawGlyph(ch) {\n      return (o, w, h) => {\n        o.fillStyle = '#fff';\n        o.font = '800 ' + Math.floor(h*0.92) + 'px Sora, system-ui, sans-serif';\n        o.textAlign = 'center'; o.textBaseline = 'middle';\n        o.fillText(ch, w/2, h/2);\n      };\n    }\n    function mk(tx, ty, b, size) {\n      return { x: Math.random()*W, y: Math.random()*H, tx, ty, b, size, ph: Math.random()*6.28, amp: 0.6 + Math.random()*1.8 };\n    }\n    function build() {\n      if (!W || !H) return;\n      const dens = self.props.density || 1;\n      particles = [];\n      const bh = H*0.62, bw = bh*0.65;\n      const cx = W*0.60 - bw/2, cy = H*0.42 - bh/2;\n      const bstep = Math.max(3, Math.floor((bh/132)/dens));\n      sample(drawBolt, Math.floor(bw), Math.floor(bh), bstep)\n        .forEach(p => particles.push(mk(cx+p[0], cy+p[1], 1, 3 + Math.random()*5)));\n      icons.forEach(ic => {\n        const s = H*ic.s;\n        const ix = W*ic.x - s/2, iy = H*ic.y - s/2;\n        const istep = Math.max(2, Math.floor((s/30)/dens));\n        sample(drawGlyph(ic.ch), Math.floor(s), Math.floor(s), istep)\n          .forEach(p => particles.push(mk(ix+p[0], iy+p[1], 0.45, 2 + Math.random()*3)));\n      });\n    }\n    this._build = build;\n\n    function resize() {\n      DPR = Math.min(2, window.devicePixelRatio || 1);\n      W = canvas.clientWidth; H = canvas.clientHeight;\n      canvas.width = Math.floor(W*DPR);\n      canvas.height = Math.floor(H*DPR);\n      ctx.setTransform(DPR,0,0,DPR,0,0);\n      build();\n    }\n    this._resize = resize;\n\n    function frame(now) {\n      const t = now - t0;\n      tmx += (mx - tmx)*0.05;\n      tmy += (my - tmy)*0.05;\n      ctx.setTransform(DPR,0,0,DPR,0,0);\n      ctx.clearRect(0,0,W,H);\n      ctx.globalCompositeOperation = 'lighter';\n      for (let i = 0; i < particles.length; i++) {\n        const p = particles[i];\n        p.x += (p.tx - p.x)*0.05;\n        p.y += (p.ty - p.y)*0.05;\n        const ox = Math.cos(t*0.0008 + p.ph)*p.amp + tmx*20*p.b;\n        const oy = Math.sin(t*0.001 + p.ph)*p.amp + tmy*20*p.b;\n        const tw = 0.65 + 0.35*Math.sin(t*0.003 + p.ph*2);\n        ctx.globalAlpha = p.b * tw;\n        const s = p.size;\n        ctx.drawImage(sp, p.x+ox - s/2, p.y+oy - s/2, s, s);\n      }\n      ctx.globalAlpha = 1;\n      ctx.globalCompositeOperation = 'source-over';\n      self._raf = requestAnimationFrame(frame);\n    }\n\n    this._onResize = () => resize();\n    this._onMove = (e) => {\n      mx = (e.clientX / window.innerWidth)*2 - 1;\n      my = (e.clientY / window.innerHeight)*2 - 1;\n    };\n    window.addEventListener('resize', this._onResize);\n    window.addEventListener('mousemove', this._onMove);\n    resize();\n    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => build());\n    this._raf = requestAnimationFrame(frame);\n  }\n\n  componentDidUpdate(prev) {\n    if (!this._build) return;\n    if (prev.accent !== this.props.accent && this._buildSprite) this._buildSprite();\n    if (prev.density !== this.props.density && this._build) this._build();\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('mousemove', this._onMove);\n  }\n\n  renderVals() {\n    return { canvasRef: this.canvasRef };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
