packages:
  - apps/studio-*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

overrides:
  sanitize-html: 2.17.7
  "sanitize-html>htmlparser2": 10.1.0
  baseline-browser-mapping: 2.11.22
  browserslist: 4.28.9
  "brace-expansion@<2.0.0": 1.1.21
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.12
  "esbuild@0.18.20": 0.25.0

minimumReleaseAgeExclude:
  - esbuild@0.25.0
  - brace-expansion@1.1.21 || 5.0.12
  - postcss@8.5.23
  - js-yaml@4.3.1 || 4.3.2
  - nanoid@3.3.18
  - browserslist@4.28.7
  - qs@6.15.4 || 6.16.0
  - fflate@0.6.11
  - baseline-browser-mapping@2.11.0
  - nodemailer@10.0.13
