<script id="kade-k-particle-js">
(function () {
  'use strict';

  /* ── SIZE: desktop clamp(380,27vw,540) | mobile clamp(220,58vw,360) ── */
  var vw = window.innerWidth;
  var vh = window.innerHeight;
  var SIZE = (vw >= 768)
    ? Math.min(Math.max(Math.round(vw * 0.27), 380), 540)
    : Math.min(Math.max(Math.round(vw * 0.58), 220), 360);
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  /* ── WRAPPER — absolute inside #ijim, true center ─────────────── */
  var wrap = document.createElement('div');
  wrap.id = 'kade-k-particle-wrap';
  wrap.style.cssText = [
    'position:absolute',
    'left:50%',
    'top:50%',
    'transform:translate(-50%,-50%)',
    'pointer-events:none',
    'z-index:5',
    'opacity:1',
    'line-height:0'
  ].join(';');

  var cvs = document.createElement('canvas');
  cvs.id = 'kade-k-particle-canvas';
  cvs.width  = Math.round(SIZE * DPR);
  cvs.height = Math.round(SIZE * DPR);
  cvs.style.width  = SIZE + 'px';
  cvs.style.height = SIZE + 'px';
  wrap.appendChild(cvs);

  var ctx = cvs.getContext('2d');
  ctx.scale(DPR, DPR);

  /* ── GOLD PALETTE ────────────────────────────────────────────── */
  var COLORS = ['#d6a21a','#f3c84b','#8a6a12','#e8b820','#ffd400','#c9991a','#f5d060'];

  /* ── LOAD PNG, find K bounding box, center + scale to fill canvas ── */
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function () {
    var W = img.width, H = img.height;
    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    var px = octx.getImageData(0, 0, W, H).data;

    /* Pass 1 — bounding box of white K pixels */
    var minX = W, maxX = 0, minY = H, maxY = 0;
    for (var y0 = 0; y0 < H; y0++) {
      for (var x0 = 0; x0 < W; x0++) {
        var i0 = (y0 * W + x0) * 4;
        if (px[i0+3] > 100 && px[i0] > 160 && px[i0+1] > 160 && px[i0+2] > 160) {
          if (x0 < minX) minX = x0;
          if (x0 > maxX) maxX = x0;
          if (y0 < minY) minY = y0;
          if (y0 > maxY) maxY = y0;
        }
      }
    }

    /* scale so K fills 90% of canvas; center of K silhouette → canvas center */
    var kW = maxX - minX || 1;
    var kH = maxY - minY || 1;
    var scale = Math.min((SIZE * 0.90) / kW, (SIZE * 0.90) / kH);
    var kCX = minX + kW / 2;
    var kCY = minY + kH / 2;

    /* Pass 2 — sample particles only within bounding box */
    var STEP = Math.max(2, Math.floor(Math.sqrt((kW * kH) / 4500)));
    var pts = [];

    for (var y = minY; y <= maxY; y += STEP) {
      for (var x = minX; x <= maxX; x += STEP) {
        var i = (y * W + x) * 4;
        if (px[i+3] > 100 && px[i] > 160 && px[i+1] > 160 && px[i+2] > 160) {
          pts.push({
            bx:    (x - kCX) * scale + SIZE / 2,
            by:    (y - kCY) * scale + SIZE / 2,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            ph:    Math.random() * Math.PI * 2,
            spd:   0.5 + Math.random() * 0.7,
            r:     1.0 + Math.random() * 1.2,
            amp:   2.5 + Math.random() * 2.5
          });
        }
      }
    }

    /* ── RENDER LOOP ───────────────────────────────────────────── */
    function draw(now) {
      ctx.clearRect(0, 0, SIZE, SIZE);
      var t = now * 0.001;
      for (var j = 0; j < pts.length; j++) {
        var p = pts[j];
        var mx = Math.sin(t * p.spd + p.ph) * p.amp;
        var my = Math.cos(t * p.spd * 0.75 + p.ph * 1.4) * (p.amp * 0.7);
        ctx.beginPath();
        ctx.arc(p.bx + mx, p.by + my, p.r, 0, 6.2832);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  };
  img.src = '/kade-k-letter.png';

  /* ── INJECT into #ijim (PW fixed viewport container) ─────────── */
  function mount() {
    var ijim = document.getElementById('ijim');
    if (!ijim) { setTimeout(mount, 300); return; }
    ijim.appendChild(wrap);
  }
  mount();

  /* ── SCROLL VISIBILITY ───────────────────────────────────────── */
  var FADE_START = vh * 0.30;
  var FADE_END   = vh * 0.75;

  function updateOpacity() {
    var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
    var op;
    if (sy <= FADE_START) {
      op = 1;
    } else if (sy >= FADE_END) {
      op = 0;
    } else {
      op = 1 - (sy - FADE_START) / (FADE_END - FADE_START);
    }
    wrap.style.opacity = op;
  }

  window.addEventListener('scroll', updateOpacity, { passive: true });
  document.addEventListener('scroll', updateOpacity, { passive: true });
  setInterval(updateOpacity, 80);

  var _push = history.pushState.bind(history);
  history.pushState = function () {
    _push.apply(history, arguments);
    var ok = ['/', '/epiminds.html', '/epiminds', '/kade-hizmetler.html', '/kade-paketler.html', '/kade-partnerler.html', '/kade-hakkimizda.html', '/kade-iletisim.html'];
    var onHero = ok.some(function(u){ return location.pathname === u || location.pathname.endsWith(u); });
    if (!onHero) { wrap.style.opacity = '0'; }
  };
})();
</script>


<script>
(function() {
  var sid = 'km-paketler';
  var attempts = 0;
  function jumpToSection() {
    var el = document.getElementById(sid);
    if (!el) return;
    var target = el.offsetTop;
    window.scrollTo({ top: target, behavior: 'instant' });
    attempts++;
    // If PW overrode the scroll, retry (up to 10 times, every 400ms)
    if (attempts < 10 && Math.abs(window.scrollY - target) > 200) {
      setTimeout(jumpToSection, 400);
    }
  }
  // Start after PW has had time to init (~2s after load)
  window.addEventListener('load', function() {
    setTimeout(jumpToSection, 2000);
  });
})();
</script>
