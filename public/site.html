<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="description" content="Kade New Media çok yakında." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="512x512" href="/kade-coming-soon-icon.png" />
    <link rel="apple-touch-icon" href="/kade-coming-soon-icon.png" />
    <title>Kade New Media — Coming Soon</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080808;
      }

      * { box-sizing: border-box; }

      html,
      body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100svh;
        overflow: hidden;
        color: #f4f4f4;
        background: rgb(11, 11, 12);
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        content: "";
        opacity: .28;
        background-image:
          radial-gradient(circle at 50% 38%, rgba(255, 255, 255, .11), transparent 31rem),
          linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
        background-size: 100% 100%, 72px 72px, 72px 72px;
        mask-image: radial-gradient(circle at center, black, transparent 72%);
      }

      .coming-soon {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        text-align: center;
        isolation: isolate;
      }

      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(90vw, 660px);
      }

      .mark-wrap {
        position: relative;
        width: clamp(220px, 42vw, 470px);
        aspect-ratio: 1;
        animation: mark-float 5s cubic-bezier(.4, 0, .2, 1) infinite;
      }

      .mark-wrap::after {
        position: absolute;
        right: 13%;
        bottom: 8%;
        left: 13%;
        height: 9%;
        z-index: -1;
        content: "";
        border-radius: 50%;
        background: rgba(255, 255, 255, .16);
        filter: blur(26px);
        animation: shadow-breathe 5s cubic-bezier(.4, 0, .2, 1) infinite;
      }

      .mark {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .title {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 1.4em;
        margin: clamp(-26px, -3vw, -14px) 0 0;
        padding-left: .34em;
        font-size: clamp(.9rem, 1.7vw, 1.12rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: .34em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, .48);
      }

      .title span {
        display: inline-block;
        animation: letter-wave 2.4s ease-in-out infinite;
        animation-delay: calc(var(--i) * 90ms);
      }

      .title .space { width: .72em; }

      @keyframes mark-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.012); }
      }

      @keyframes shadow-breathe {
        0%, 100% { opacity: .35; transform: scale(.88); }
        50% { opacity: .75; transform: scale(1.08); }
      }

      @keyframes letter-wave {
        0%, 42%, 100% { color: rgba(255, 255, 255, .42); transform: translateY(0); text-shadow: none; }
        18% { color: #fff; transform: translateY(-3px); text-shadow: 0 0 18px rgba(255, 255, 255, .36); }
      }

      @media (max-height: 620px) {
        .mark-wrap { width: min(52vh, 330px); }
        .title { margin-top: -12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark-wrap,
        .mark-wrap::after,
        .title span { animation: none; }
        .title span { color: rgba(255, 255, 255, .7); }
      }
    </style>
  </head>
  <body data-coming-soon>
    <main class="coming-soon" aria-labelledby="coming-soon-title">
      <div class="lockup">
        <div class="mark-wrap">
          <img class="mark" src="/kade-coming-soon-icon.png" alt="Kade New Media" width="1024" height="1024" />
        </div>
        <h1 class="title" id="coming-soon-title" aria-label="Coming Soon">
          <span style="--i:0">C</span><span style="--i:1">O</span><span style="--i:2">M</span><span style="--i:3">I</span><span style="--i:4">N</span><span style="--i:5">G</span><span class="space" aria-hidden="true"></span><span style="--i:6">S</span><span style="--i:7">O</span><span style="--i:8">O</span><span style="--i:9">N</span>
        </h1>
      </div>
    </main>
  </body>
</html>
