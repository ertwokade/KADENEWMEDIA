<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160">
  <defs>
    <linearGradient id="lt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e058"/>
      <stop offset="60%" stop-color="#eac321"/>
      <stop offset="100%" stop-color="#d4b820"/>
    </linearGradient>
    <linearGradient id="dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a5008"/>
      <stop offset="100%" stop-color="#9a7a12"/>
    </linearGradient>
    <linearGradient id="md" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a818"/>
      <stop offset="100%" stop-color="#8a6e0e"/>
    </linearGradient>
  </defs>

  <!-- Upper arm — front face (bright gold) -->
  <polygon points="18,2 86,2 54,78 34,78" fill="url(#lt)"/>

  <!-- Upper arm — left dark face -->
  <polygon points="2,20 18,2 34,78 18,78" fill="url(#dk)"/>

  <!-- Middle connector (notch) -->
  <polygon points="34,78 54,78 66,98 46,98" fill="url(#md)"/>

  <!-- Lower arm — front face (bright gold) -->
  <polygon points="46,98 66,98 98,158 26,158" fill="url(#lt)"/>

  <!-- Lower arm — left dark face -->
  <polygon points="8,138 26,158 46,98 28,98" fill="url(#dk)" opacity="0.85"/>
</svg>
