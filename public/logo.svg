  </defs>

  <!-- Icon: 4 triangles (pinwheel) -->
  <!-- top-left large -->
  <polygon points="2,2 26,2 2,26" fill="url(#i1)"/>
  <!-- top-right small -->
  <polygon points="29,2 52,2 52,25" fill="url(#i2)"/>
  <!-- bottom-left small -->
  <polygon points="2,29 25,52 2,52" fill="url(#i2)"/>
  <!-- bottom-right large -->
  <polygon points="28,52 52,28 52,52" fill="url(#i2)" opacity="0.85"/>

  <!-- Text: KADE MEDIA using simple rectangles/paths -->
  <!-- K -->
  <rect x="64" y="12" width="4" height="32" fill="url(#tg)"/>
  <polygon points="68,28 86,12 82,12 64,28" fill="url(#tg)"/>
  <polygon points="68,28 86,44 82,44 64,28" fill="url(#tg)"/>

  <!-- A -->
  <polygon points="94,44 104,12 108,12 118,44 114,44 106,16 98,44" fill="url(#tg)"/>
  <rect x="99" y="31" width="14" height="4" fill="url(#tg)"/>

  <!-- D -->
  <rect x="124" y="12" width="4" height="32" fill="url(#tg)"/>
  <path d="M128 12 Q148 12 148 28 Q148 44 128 44 L128 40 Q142 40 142 28 Q142 16 128 16 Z" fill="url(#tg)"/>

  <!-- E -->
  <rect x="154" y="12" width="4" height="32" fill="url(#tg)"/>
  <rect x="158" y="12" width="16" height="4" fill="url(#tg)"/>
  <rect x="158" y="26" width="13" height="4" fill="url(#tg)"/>
  <rect x="158" y="40" width="16" height="4" fill="url(#tg)"/>
