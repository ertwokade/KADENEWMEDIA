<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none">
  <defs>
    <linearGradient id="i1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e058"/>
      <stop offset="100%" stop-color="#eac321"/>
    </linearGradient>
    <linearGradient id="i2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eac321"/>
      <stop offset="100%" stop-color="#7a6010"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5e058"/>
      <stop offset="60%" stop-color="#eac321"/>
      <stop offset="100%" stop-color="#c9a81c"/>
