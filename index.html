    <!--
      Canonical ve og:url burada BİLEREK sabit tanımlanmaz.
      Bu dosya build sonrası app.html olur ve /blog/:slug, /partnerler/:id, /@handle
      gibi TÜM dinamik rotalara servis edilir. Sabit bir "/" canonical bırakmak,
      bu URL'lerin tamamının kendini ana sayfanın kopyası ilan etmesine ve
      Google tarafından indeksten düşürülmesine yol açıyordu.
      - Statik ön-render edilen rotalara canonical'ı scripts/generate-static-routes.mjs enjekte eder.
      - Dinamik rotalarda canonical'ı çalışma anında src/hooks/useSEO.js oluşturur.
    -->

    <!--
      JSON-LD: Organization (ham HTML / ilk tarama için).
      Uygulama çalışınca src/components/StructuredData.jsx aynı kuruluş için
      daha zengin bir düğüm enjekte ediyor. Ortak "@id" olmadan Google sayfada
      iki ayrı kuruluş varlığı görüyordu; aynı @id ikisini tek düğümde birleştirir.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://kadenewmedia.com/#organization",
      "name": "Kade New Media",
      "alternateName": ["Kade New Media", "Kademedia", "Kadenewmedia", "Kade"],
      "url": "https://kadenewmedia.com/",

      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "email": "thekademedia@gmail.com",
        "availableLanguage": ["Turkish"]
      }
    }
    </script>

    <!--
      Tek font ailesi: Poppins (self-host, latin + latin-ext).
      Tanımların tamamı src/styles/kade-tokens.css içindedir.
      Yalnızca ilk boyanın ihtiyaç duyduğu iki dosya preload edilir; kalan
      ağırlıklar CSS'ten keşfedilip gerektiğinde indirilir.
      Google Fonts bağlantısı bilerek kaldırıldı: dört aile (Inter, Newsreader,
      Outfit, Plus Jakarta Sans) render-blocking olarak yükleniyor ve hiçbiri
      artık kullanılmıyordu.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins/poppins-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins/poppins-600-latin.woff2" crossorigin />
    <title>Kade New Media | New Media, Medya ve Dijital Pazarlama Ajansı</title>
    <!--
      Tema, React mount olmadan ÖNCE uygulanır. ThemeContext bunu bir
      useEffect içinde de yapıyor; ama o ilk boyadan sonra çalıştığı için
      ziyaretçi her girişte bir kare yanlış renk görüyordu.

      Anahtar ve değer kümesi anasayfa snapshot'ıyla AYNI olmalı
      (`theme` = light | dark | system); ayrıştıkları sürüm, sistemi açık
      temada olan ziyaretçiye krem anasayfa + koyu iç sayfa gösteriyordu.
      Kayıt yoksa işletim sistemi teması izlenir.
      Senkron ve bağımlılıksız: render'ı ölçülebilir biçimde geciktirmez.
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          /* Anasayfa snapshot'ı ziyaretçiyi bir kez açık temaya alıyor. Bu göç
             yalnız snapshot'ta çalıştığı sürece, siteye önce bir React
             rotasından (ör. /blog/:slug) giren ve işletim sistemi koyu olan
             ziyaretçi koyu bir sayfa görüyor, sonra bir pazarlama sayfasına
             geçtiğinde site kalıcı olarak krem oluyordu. İki giriş noktası da
             aynı göçü uygulamalı. */
          var migration = 'kade-light-default-2026-08-17';
          if (window.localStorage.getItem(migration) !== '1') {
            window.localStorage.setItem('theme', 'light');
            window.localStorage.setItem(migration, '1');
          }
          var stored = window.localStorage.getItem('theme')
            || window.localStorage.getItem('kade-theme-mode');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          theme = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
        } catch (e) {
          /* Depolama kapalıysa CSS varsayılanı (koyu) geçerli kalır. */
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-mode', theme);
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1111' : '#fbfaf4');
      })();
    </script>
  </head>
